<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review meaningful Waffle Berry memories.">
    <title>Memories to Review | Waffle Berry</title>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main id="website" class="website-unlocked memory-review-page">
        <div class="particles" aria-hidden="true">
            <span class="particle particle-1">✦</span>
            <span class="particle particle-2">●</span>
            <span class="particle particle-3">♥</span>
        </div>
        <nav
            data-back-navigation
            data-back-href="legacy-studio.html"
            data-back-param="legacyId"
        ></nav>
        <header class="navbar">
            <a href="experience.html" class="brand" aria-label="Waffle Berry experiences">
                <span class="brand-icon">🧇</span>
                <span class="brand-text">Waffle Berry</span>
            </a>
            <div class="navbar-actions">
                <a class="logout-button" href="login.html">Sign out</a>
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </header>

        <section class="memory-review-section" aria-labelledby="memoryReviewTitle">
            <div class="memory-review-shell">
                <header class="memory-review-header">
                    <p class="eyebrow">Memories to Review</p>
                    <h1 id="memoryReviewTitle">Preserved Memories</h1>
                    <p id="memoryReviewCount">Berry proposes. You decide what becomes part of the legacy.</p>
                </header>
                <div class="memory-review-filters" aria-label="Memory filters">
                    <button class="memory-filter is-active" type="button" data-review-filter="all">All</button>
                    <button class="memory-filter" type="button" data-review-filter="contradictions">Conflicting Memories</button>
                    <button class="memory-filter" type="button" data-review-filter="enrichments">Related Memories</button>
                    <label>
                        <span>Category</span>
                        <select id="memoryCategoryFilter">
                            <option value="">Every category</option>
                            <option value="personal_detail">Personal details</option>
                            <option value="relationship">Relationships</option>
                            <option value="life_event">Life events</option>
                            <option value="tradition">Traditions</option>
                            <option value="value">Values</option>
                            <option value="story">Stories</option>
                        </select>
                    </label>
                </div>
                <div id="memoryReviewStatus" class="memory-review-status" role="status" aria-live="polite">
                    Loading memories…
                </div>
                <div id="memoryReviewList" class="memory-review-list"></div>
                <button id="memoryReviewRetry" class="secondary-button" type="button" hidden>Try again</button>
            </div>
        </section>

        <dialog id="memoryEditDialog" class="memory-review-dialog" aria-labelledby="memoryEditTitle">
            <form id="memoryEditForm" class="glass-card memory-review-dialog-card">
                <h2 id="memoryEditTitle">Edit Memory</h2>
                <input id="memoryEditId" type="hidden">
                <label>Title<input id="memoryEditTitleInput" required maxlength="255"></label>
                <label>Memory<textarea id="memoryEditSummary" required rows="5"></textarea></label>
                <label>Category<select id="memoryEditCategory" required></select></label>
                <label>Importance<select id="memoryEditImportance">
                    <option value="">Not set</option>
                    <option value="1">1 — Gentle detail</option>
                    <option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5 — Essential</option>
                </select></label>
                <label>Uncertainty<textarea id="memoryEditUncertainty" rows="2" placeholder="For example: The year may be approximate."></textarea></label>
                <p id="memoryEditError" class="form-error" role="alert"></p>
                <div class="memory-dialog-actions">
                    <button class="secondary-button" type="button" data-close-dialog>Cancel</button>
                    <button class="primary-button" type="submit">Save Changes</button>
                </div>
            </form>
        </dialog>

        <dialog id="memoryRejectDialog" class="memory-review-dialog" aria-labelledby="memoryRejectTitle">
            <form id="memoryRejectForm" class="glass-card memory-review-dialog-card">
                <h2 id="memoryRejectTitle">Remove this memory?</h2>
                <p id="memoryRejectMessage"></p>
                <p>The source will remain safely preserved for audit history.</p>
                <div class="memory-dialog-actions">
                    <button class="secondary-button" type="button" data-close-dialog>Cancel</button>
                    <button class="danger-button" type="submit">Remove Memory</button>
                </div>
            </form>
        </dialog>
    </main>
    <script src="js/theme.js"></script>
    <script src="js/back-navigation.js"></script>
    <script src="js/legacy-state.js"></script>
    <script src="js/memory-review.js"></script>
</body>
</html>
