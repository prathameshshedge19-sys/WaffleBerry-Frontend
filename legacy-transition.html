<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Preparing your Waffle Berry companion."
    >

    <title>Preparing Your Companion | Waffle Berry</title>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main
        id="website"
        class="website-unlocked companion-transition-page"
    >

        <div class="particles" aria-hidden="true">
            <span class="particle particle-1">✦</span>
            <span class="particle particle-2">●</span>
            <span class="particle particle-3">♥</span>
            <span class="particle particle-4">✦</span>
            <span class="particle particle-5">●</span>
            <span class="particle particle-6">♥</span>
            <span class="particle particle-7">✦</span>
            <span class="particle particle-8">●</span>
        </div>

        <section
            class="companion-transition-section"
            aria-labelledby="companionTransitionTitle"
        >
            <div class="companion-transition-shell">
                <img
                    class="companion-transition-mascot"
                    src="assets/waffle-berry-mascot.png"
                    alt="Berry preparing your companion"
                >

                <article class="glass-card companion-transition-card">
                    <div
                        class="card-shine"
                        aria-hidden="true"
                    ></div>

                    <div class="companion-transition-copy">
                        <p class="eyebrow">
                            Legacy Builder
                        </p>

                        <h1 id="companionTransitionTitle">
                            Preparing Your Companion
                        </h1>

                        <p
                            id="companionTransitionMessage"
                            class="companion-transition-message"
                        ></p>
                    </div>

                    <ol
                        id="companionProgress"
                        class="companion-progress"
                        aria-live="polite"
                        aria-label="Companion preparation progress"
                    ></ol>
                </article>
            </div>
        </section>

    </main>

    <script src="js/theme.js"></script>
    <script src="js/legacy-state.js"></script>
    <script src="js/legacy-transition.js"></script>

</body>

</html>
