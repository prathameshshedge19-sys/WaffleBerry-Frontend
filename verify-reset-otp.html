<html lang="en">

    <title>Verify Reset Code | LegaRya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/back-navigation.css?v=back1">
    <link rel="stylesheet" href="css/i18n.css?v=languages1">
    <script src="js/i18n.js?v=languages1"></script>
    <link rel="stylesheet" href="css/product-guide.css?v=guide2">

</head>
  <body><main class="auth-page single-auth">
    <section class="auth-panel-wrap" aria-labelledby="pageTitle"><div class="auth-panel">
      <a class="auth-back premium-back" href="forgot-password.html" aria-label="Back to password recovery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/><path d="M8 12h12"/></svg><span>Back</span></a>
      <header><a class="legarya-brand" href="index.html"><span class="legarya-prefix">Lega</span><span class="rya-glow">Rya</span></a><p class="byline">by WaffleBerry</p></header>
      <div class="auth-heading"><h1 id="pageTitle">Verify reset code</h1><p id="verificationDescription">We sent a six-digit password reset code to your email.</p></div>
      <form id="verificationForm" class="auth-form">
        <div class="form-group"><label for="otpInput">Verification code</label><input id="otpInput" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required /></div>
        <button id="verifyButton" class="auth-submit" type="submit">Verify code <span aria-hidden="true">&rarr;</span></button>
      </form>
      <p class="auth-toggle">Didn't receive the code? <button id="resendOtpButton" type="button">Resend code</button></p>
      <p id="authMessage" class="auth-message" aria-live="polite"></p>
    </div></section>
  </main><script src="js/auth-config.js?v=1.0"></script><script src="js/auth-api.js?v=1.0"></script><script src="js/verify-reset-otp.js?v=1.0"></script></body>
</html>
