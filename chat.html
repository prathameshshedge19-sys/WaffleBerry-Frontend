<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Continue a meaningful Waffle Berry conversation."
    >

    <title>Chat | Waffle Berry</title>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="website" class="website-unlocked">

        <!-- Decorative floating particles -->
        <div class="particles" aria-hidden="true">
            <span class="particle particle-1">✦</span>
            <span class="particle particle-2">●</span>
            <span class="particle particle-3">♥</span>
            <span class="particle particle-4">✦</span>
            <span class="particle particle-5">●</span>
            <span class="particle particle-6">♥</span>
            <span class="particle particle-7">✦</span>
            <span class="particle particle-8">●</span>
        </div>

        <nav
            data-back-navigation
            data-back-href="legacy-dashboard.html"
        ></nav>

        <!-- Navigation -->
        <header class="navbar">

            <a href="home.html" class="brand">
                <span class="brand-icon">🧇</span>

                <span class="brand-text">
                    Waffle Berry
                </span>
            </a>

            <nav class="nav-links" aria-label="Main navigation">

                <a
                    class="nav-link"
                    href="home.html"
                >
                    Home
                </a>

                <a
                    class="nav-link active"
                    href="chat.html"
                >
                    Chat
                </a>

                <a
                    class="nav-link"
                    href="mission.html"
                >
                    Mission
                </a>

            </nav>

            <div class="navbar-actions">

                <a
                    class="logout-button"
                    href="login.html"
                    title="Sign out"
                >
                    Sign out
                </a>

                <button
                    id="themeToggle"
                    class="theme-toggle"
                    type="button"
                    aria-label="Switch to dark mode"
                >
                    <span id="themeIcon">🌙</span>
                </button>

            </div>

        </header>

        <!-- Chat section -->
        <section
            id="chatSection"
            class="page-section active-section"
        >

            <div class="chat-layout">

                <aside class="assistant-panel glass-panel">

                    <img
                        src="assets/waffle-berry-mascot.png"
                        alt=""
                        class="chat-mascot"
                    >

                    <h2 data-companion-name>Companion</h2>

                    <p>
                        Here for your stories, memories and meaningful moments.
                    </p>

                    <div class="assistant-status">
                        <span class="status-dot"></span>
                        Online
                    </div>

                    <button
                        id="newChatButton"
                        class="secondary-button new-chat-button"
                        type="button"
                    >
                        + New Chat
                    </button>

                    <div class="conversation-sidebar">
                        <p class="conversation-sidebar-label">
                            Conversations
                        </p>

                        <div
                            id="conversationList"
                            class="conversation-list"
                            aria-live="polite"
                        ></div>
                    </div>

                </aside>

                <section class="chat-window glass-panel">

                    <header class="chat-header">

                        <div>
                            <h2
                                id="conversationTitle"
                                data-companion-template="Conversation with {name}"
                            >
                                Your conversation
                            </h2>

                            <p
                                id="chatStatus"
                                aria-live="polite"
                            >
                                Share a memory, story or meaningful moment.
                            </p>
                        </div>

                        <button
                            id="clearChatButton"
                            class="icon-button"
                            type="button"
                            aria-label="Delete conversation"
                        >
                            🗑️
                        </button>

                    </header>

                    <div
                        id="chatMessages"
                        class="chat-messages"
                        aria-live="polite"
                    ></div>

                    <form
                        id="chatForm"
                        class="chat-input-area"
                    >

                        <button
                            class="input-icon-button"
                            type="button"
                        >
                            ＋
                        </button>

                        <textarea
                            id="chatInput"
                            rows="1"
                            placeholder="Share a memory..."
                            data-companion-placeholder="Share a memory with {name}..."
                            autocomplete="off"
                            aria-label="Message your companion"
                            data-companion-label="Message {name}"
                            required
                        ></textarea>

                        <button
                            id="sendButton"
                            class="send-button"
                            type="submit"
                            aria-label="Send message"
                        >
                            ➤
                        </button>

                    </form>

                </section>

            </div>

        </section>

    </main>
    <script src="js/theme.js"></script>
    <script src="js/back-navigation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.3.3/dist/purify.min.js"></script>
    <script src="js/legacy-state.js"></script>
    <script src="js/companion-identity.js"></script>
    <script src="js/chat.js"></script>
</body>

</html>
