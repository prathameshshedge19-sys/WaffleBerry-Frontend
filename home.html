<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Meet Berry, your Waffle Berry AI companion."
    >

    <title>Home | Waffle Berry</title>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="website" class="website-unlocked">

        <!-- Decorative floating particles -->
        <div class="particles" aria-hidden="true">
            <span class="particle particle-1">✦</span>
            <span class="particle particle-2">●</span>
            <span class="particle particle-3">♥</span>
            <span class="particle particle-4">✦</span>
            <span class="particle particle-5">●</span>
            <span class="particle particle-6">♥</span>
            <span class="particle particle-7">✦</span>
            <span class="particle particle-8">●</span>
        </div>

        <!-- Navigation -->
        <header class="navbar">

            <a href="home.html" class="brand">
                <span class="brand-icon">🧇</span>

                <span class="brand-text">
                    Waffle Berry
                </span>
            </a>

            <nav class="nav-links" aria-label="Main navigation">

                <a
                    class="nav-link active"
                    href="home.html"
                >
                    Home
                </a>

                <a
                    class="nav-link"
                    href="chat.html"
                >
                    Chat
                </a>

                <a
                    class="nav-link"
                    href="mission.html"
                >
                    Mission
                </a>

            </nav>

            <div class="navbar-actions">

                <a
                    class="logout-button"
                    href="login.html"
                    title="Sign out"
                >
                    Sign out
                </a>

                <button
                    id="themeToggle"
                    class="theme-toggle"
                    type="button"
                    aria-label="Switch to dark mode"
                >
                    <span id="themeIcon">🌙</span>
                </button>

            </div>

        </header>

        <!-- Home section -->
        <section
            id="homeSection"
            class="page-section active-section"
        >

            <div class="hero">

                <div class="glass-card hero-card">

                    <div
                        class="card-shine"
                        aria-hidden="true"
                    ></div>

                    <img
                        src="assets/waffle-berry-mascot.png"
                        alt="Berry, the Waffle Berry AI mascot"
                        id="mascot"
                    >

                    <div class="hero-content">

                        <p class="eyebrow">
                            Your AI memory companion
                        </p>

                        <h1
                            id="typedHeading"
                            aria-label="Hello, I'm Berry."
                        ></h1>

                        <p
                            id="typedDescription"
                            class="hero-description"
                            aria-label="I preserve memories, stories and conversations so the people you love are never forgotten."
                        ></p>

                        <a
                            id="startChatButton"
                            class="primary-button hidden-action"
                            href="chat.html"
                        >
                            <span>Start Chat</span>
                            <span class="button-arrow">→</span>
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="js/theme.js"></script>
    <script src="js/home.js"></script>

</body>

</html>
