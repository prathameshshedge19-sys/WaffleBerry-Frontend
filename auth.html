<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Sign in to LegaRya or begin your digital legacy." />
    <meta name="theme-color" content="#050504" />
    <link rel="icon" href="favicon.ico?v=1" sizes="any" />
    <link rel="icon" href="favicon-32x32.png?v=1" type="image/png" sizes="32x32" />
    <link rel="icon" href="favicon.svg?v=1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=1" />
    <link rel="manifest" href="site.webmanifest?v=1" />
    <title>Sign In | LegaRya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/auth.css?v=1.0" />
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-panel-wrap" aria-labelledby="authTitle">
        <div class="auth-panel">
          <a class="auth-back" href="index.html"><span aria-hidden="true">&larr;</span> Back to LegaRya</a>
          <header>
            <a class="legarya-brand" href="index.html" aria-label="LegaRya home"><span class="legarya-prefix">Lega</span><span class="rya-glow">Rya</span></a>
            <p class="byline">by WaffleBerry</p>
          </header>

          <div class="auth-heading">
            <h1 id="authTitle">Welcome back</h1>
            <p id="authDescription">Continue your memories, stories and conversations with <span class="rya-glow">Rya</span>.</p>
          </div>

          <div class="auth-modes" role="tablist" aria-label="Authentication mode">
            <button class="auth-mode" type="button" role="tab" data-auth-mode="login" aria-selected="true">Sign In</button>
            <button class="auth-mode" type="button" role="tab" data-auth-mode="register" aria-selected="false">Create Account</button>
          </div>

          <div class="provider-stack">
            <div id="googleSignIn" class="google-signin" aria-live="polite">
              <button class="google-placeholder" type="button" disabled>Continue with Google</button>
            </div>
          </div>

          <div class="auth-divider"><span></span><p>or continue with email</p><span></span></div>

          <form id="authForm" class="auth-form">
            <div id="fullNameGroup" class="form-group" hidden>
              <label for="fullNameInput">Full name</label>
              <input id="fullNameInput" type="text" placeholder="Enter your full name" autocomplete="name" />
            </div>

            <div class="form-group">
              <label for="emailInput">Email address</label>
              <input id="emailInput" type="email" placeholder="name@example.com" autocomplete="email" required />
            </div>

            <div id="passwordGroup" class="form-group">
              <div class="form-label-row">
                <label for="passwordInput">Password</label>
                <a class="text-link" href="forgot-password.html">Forgot password?</a>
              </div>
              <div class="password-field">
                <input id="passwordInput" type="password" placeholder="Enter your password" autocomplete="current-password" required />
                <button id="togglePassword" class="password-toggle" type="button" aria-label="Show password">Show</button>
              </div>
            </div>

            <label id="rememberGroup" class="check-row">
              <input id="rememberInput" type="checkbox" />
              <span>Remember me on this device</span>
            </label>

            <label id="termsGroup" class="check-row" hidden>
              <input id="termsInput" type="checkbox" />
              <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a> and acknowledge the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span>
            </label>

            <button id="authSubmit" class="auth-submit" type="submit"><span id="authSubmitText">Sign In</span><span aria-hidden="true">&rarr;</span></button>
          </form>

          <p class="auth-toggle"><span id="authTogglePrompt">Don't have an account?</span> <button id="authToggle" type="button">Create Account</button></p>
          <p id="authMessage" class="auth-message" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <dialog id="googleTermsDialog" class="auth-dialog" aria-labelledby="googleTermsTitle">
      <form id="googleTermsForm" method="dialog" class="dialog-card">
        <h2 id="googleTermsTitle">Begin your Legacy</h2>
        <p>To create an account with Google, please accept WaffleBerry's Terms &amp; Conditions.</p>
        <label class="check-row" for="googleTermsInput">
          <input id="googleTermsInput" type="checkbox" />
          <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a> and acknowledge the <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span>
        </label>
        <p id="googleTermsMessage" class="auth-message" aria-live="polite"></p>
        <div class="dialog-actions">
          <button id="googleTermsCancel" class="secondary-action" type="button">Cancel</button>
          <button id="googleTermsSubmit" class="auth-submit" type="submit">Create Account</button>
        </div>
      </form>
    </dialog>

    <script src="js/auth-diagnostics.js?v=1.0"></script>
    <script src="js/auth-config.js?v=1.0"></script>
    <script src="js/auth-api.js?v=1.4"></script>
    <script src="js/auth.js?v=1.1"></script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="window.initializeLegaryaGoogleSignIn()"></script>
  </body>
</html>
