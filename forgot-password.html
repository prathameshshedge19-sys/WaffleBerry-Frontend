  <body><main class="auth-page single-auth">
    <section class="auth-panel-wrap" aria-labelledby="pageTitle"><div class="auth-panel">
      <a class="auth-back premium-back" href="auth.html?mode=login" aria-label="Back to sign in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/><path d="M8 12h12"/></svg><span>Back</span></a>

      <div class="auth-heading"><h1 id="pageTitle">Reset your password</h1><p>Enter your email and we will send a six-digit verification code.</p></div>
      <form id="forgotPasswordForm" class="auth-form">
        <div class="form-group"><label for="emailInput">Email address</label><input id="emailInput" type="email" placeholder="name@example.com" autocomplete="email" required /></div>
        <button id="submitButton" class="auth-submit" type="submit">Send verification code <span aria-hidden="true">&rarr;</span></button>
      </form>
      <p id="authMessage" class="auth-message" aria-live="polite"></p>
    </div></section>
  </main><script src="js/auth-config.js?v=1.0"></script><script src="js/auth-api.js?v=1.0"></script><script src="js/forgot-password.js?v=1.0"></script></body>
