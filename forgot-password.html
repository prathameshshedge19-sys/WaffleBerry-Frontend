<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Forgot your password? Reset it here."
    >

    <title>Forgot Password | Waffle Berry</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Login screen with looping video -->
    <section id="authScreen">

        <!-- Blurred background video -->
        <video
            id="authBackgroundVideo"
            autoplay
            muted
            playsinline
            loop
        >
            <source
                src="assets/waffle-berry-intro.mp4"
                type="video/mp4"
            >
        </video>

        <!-- Main looping video -->
        <video
            id="authMainVideo"
            autoplay
            muted
            playsinline
            loop
        >
            <source
                src="assets/waffle-berry-intro.mp4"
                type="video/mp4"
            >
        </video>

        <!-- Dark overlay for readability -->
        <div class="auth-overlay"></div>

        <!-- Login card -->
        <div class="auth-card">

            <div class="auth-brand">
                <span class="auth-brand-icon">🧇</span>

                <div>
                    <h1>Waffle Berry</h1>
                    <p>We make people live forever.</p>
                </div>
            </div>

            <div class="auth-heading">
                <h2 id="authTitle">Forgot Password</h2>

                <p id="authDescription">
                    Enter your email address and we'll send you a one-time verification code (OTP) to reset your password.
                </p>
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="emailInput">
                        Email address
                    </label>

                    <input
                        id="emailInput"
                        type="email"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                    >
                </div>
                
                <button
                    id="authSubmitButton"
                    class="login-button"
                    type="submit"
                >
                    <span id="authSubmitText">Send OTP</span>
                    <span class="login-arrow">→</span>
                </button>
                
                <button
                    id="backToLoginButton"
                    class="forgot-password"
                    type="button"
                >
                    ← Back to Sign In
                </button>
            </form>

            <p
                id="loginMessage"
                class="login-message"
                aria-live="polite"
            ></p>

        </div>

    </section>
    <script src="js/api.js?v=otp-auth-2"></script>
    <script src="js/forgot-password.js"></script>
</body>

</html>
