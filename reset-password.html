<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="robots" content="noindex, follow" /><meta name="theme-color" content="#050504" />
    <link rel="icon" href="favicon.ico?v=1" sizes="any" /><link rel="icon" href="favicon-32x32.png?v=1" type="image/png" sizes="32x32" /><link rel="icon" href="favicon.svg?v=1" type="image/svg+xml" /><link rel="apple-touch-icon" href="apple-touch-icon.png?v=1" /><link rel="manifest" href="site.webmanifest?v=1" />
    <title>Reset Password | LegaRya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/auth.css?v=1.0" />
  </head>
  <body><main class="auth-page single-auth">
    <section class="auth-panel-wrap" aria-labelledby="pageTitle"><div class="auth-panel">
      <a class="auth-back" href="auth.html?mode=login"><span aria-hidden="true">&larr;</span> Back to Sign In</a>
      <header><a class="legarya-brand" href="index.html"><span class="legarya-prefix">Lega</span><span class="rya-glow">Rya</span></a><p class="byline">by WaffleBerry</p></header>
      <div class="auth-heading"><h1 id="pageTitle">Create a new password</h1><p>Choose a secure password with at least eight characters, one letter and one number.</p></div>
      <form id="resetPasswordForm" class="auth-form">
        <div class="form-group"><label for="passwordInput">New password</label><input id="passwordInput" type="password" autocomplete="new-password" minlength="8" required /></div>
        <div class="form-group"><label for="confirmPasswordInput">Confirm password</label><input id="confirmPasswordInput" type="password" autocomplete="new-password" minlength="8" required /></div>
        <button id="submitButton" class="auth-submit" type="submit">Reset password <span aria-hidden="true">&rarr;</span></button>
      </form>
      <p id="authMessage" class="auth-message" aria-live="polite"></p>
    </div></section>
  </main><script src="js/auth-config.js?v=1.0"></script><script src="js/auth-api.js?v=1.0"></script><script src="js/reset-password.js?v=1.0"></script></body>
</html>
